<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabletop FAQ</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        /* Main Card */
        .container {
            background: white;
            padding: 30px;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .faq-item {
            text-align: left;
            margin-bottom: 15px;
        }

        .faq-item h3 {
            color: #007bff;
            margin-bottom: 5px;
        }

        .faq-item p {
            color: #555;
        }

        /* Download Button */
        .download-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            font-size: 16px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .download-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SquareBased FAQ</h1>
        <div class="faq-item">
            <h3>Can I create my own characters?</h3>
            <p>Yes! Most games encourage custom characters with unique abilities.</p>
        </div>

        <a class="download-btn" href="tabletop-faq.pdf" download>📄 Download PDF</a>
    </div>

</body>
</html>
